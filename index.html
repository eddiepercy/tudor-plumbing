    <script>
      // Instagram bio links rewrite &#34;#&#34; as &#34;%23&#34;. Normalize back to a real
      // hash fragment before React mounts so attribution capture keeps working.
      (function () {
        try {
          var path = location.pathname;
          var idx = path.search(/%23/i);
          if (idx === -1) return;
          var before = path.slice(0, idx);
          var frag = decodeURIComponent(path.slice(idx));
          var newPath = before === &#34;&#34; ? &#34;/&#34; : before;
          history.replaceState(null, &#34;&#34;, newPath + location.search + frag);
        } catch (_) { /* no-op */ }
      })();
    </script>
